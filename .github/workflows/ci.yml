name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./internal/wire -run '^$' -fuzz FuzzDecode -fuzztime 10s -parallel 2
      - run: go build -trimpath -o bin/pingtun ./cmd/pingtun
      - run: GOOS=linux GOARCH=arm64 go build -trimpath -o bin/pingtun-arm64 ./cmd/pingtun
