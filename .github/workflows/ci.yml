name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./internal/wire -run '^$' -fuzz '^FuzzDecode$' -fuzztime 10s -parallel 2
      - run: go test ./internal/wire -run '^$' -fuzz '^FuzzDecodeProbe$' -fuzztime 10s -parallel 2
      - run: go test ./internal/wire -run '^$' -fuzz '^FuzzDecodeAdaptive$' -fuzztime 10s -parallel 2
      - run: go build -trimpath -o bin/pingtun ./cmd/pingtun
      - run: GOOS=linux GOARCH=arm64 go build -trimpath -o bin/pingtun-arm64 ./cmd/pingtun
  netns:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, adaptive]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables curl python3
      - run: CGO_ENABLED=0 go build -trimpath -o bin/pingtun ./cmd/pingtun
      - name: NAT, loss, integrity and recovery
        run: |
          pingtun_raw=0
          if [ '${{ matrix.mode }}' = legacy ]; then pingtun_raw=1; fi
          # Namespace root cannot override permissions on runner-owned private
          # checkout ancestors. Stage only lab inputs in root-owned /tmp paths.
          pingtun_stage=/tmp/pingtun-ci-inputs
          sudo install -d -m 700 "$pingtun_stage" "$pingtun_stage/bin" "$pingtun_stage/tests" "$pingtun_stage/deploy"
          sudo install -m 755 bin/pingtun "$pingtun_stage/bin/pingtun"
          sudo install -m 755 tests/netns.sh "$pingtun_stage/tests/netns.sh"
          sudo install -m 644 tests/http_fixture.py "$pingtun_stage/tests/http_fixture.py"
          sudo install -m 644 deploy/*.nft "$pingtun_stage/deploy/"
          sudo env PINGTUN_LAB_MODE='${{ matrix.mode }}' PINGTUN_LAB_RAW="$pingtun_raw" PINGTUN_LAB_ID_MODE=rotate "$pingtun_stage/tests/netns.sh" "$pingtun_stage/bin/pingtun" /tmp/pingtun-ci-results
          if [ '${{ matrix.mode }}' = adaptive ]; then
            sudo cat /tmp/pingtun-ci-results/adaptive-summary.json
            sudo cat /tmp/pingtun-ci-results/idle.json
          fi
      - name: Key-free diagnostics on failure
        if: failure()
        run: |
          for pingtun_log in tunnel-client.log tunnel-server.log http.log probe-server.log; do
            sudo cat "/tmp/pingtun-ci-results/$pingtun_log" 2>/dev/null || true
          done
